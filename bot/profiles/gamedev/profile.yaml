# Профиль GameDev: бизнес-сторона игровой индустрии (не для игроков).
title: "GameDev Biz Digest"

system_niche: "новин геймдев-індустрії (бізнес-сторона: розробка, видавництво, ринок)"
summary_hint: "чим це важливо для бізнесу в геймдеві — студії, видавця чи інвестора"

criteria: |
  Ніша: БІЗНЕС геймдев-індустрії — не для гравців, а для тих, хто робить, видає
  й інвестує в ігри. Ринки: світові та СНД.
  Відбирай новини, які показують КУДИ РУХАЄТЬСЯ ІНДУСТРІЯ, за темами:
  1. ТРЕНДИ ІНДУСТРІЇ — напрямки розвитку, зміни платформ і сторів, поведінка
     ринку, регуляції, прогнози й аналітика галузі.
  2. УГОДИ ТА ІНВЕСТИЦІЇ — раунди, M&A, покупки/продажі студій і видавців,
     фонди, звільнення, закриття та відкриття компаній.
  3. РЕЛІЗИ ТА ТЕХНОЛОГІЇ — рушії (Unity/Unreal), інструменти розробки, AI в
     геймдеві, нові платформи, важливі релізи в бізнес-контексті.
  4. РИНОК І МОНЕТИЗАЦІЯ — виторг і чарти, F2P/преміум, реклама в іграх,
     підписки, UA й ретеншн, ринкова аналітика.

  Фокус — бізнес і тренди, а не геймплей для гравців.
  Відсіюй: огляди-проходження та гайди для гравців, чисті анонси геймплею без
  бізнес-контексту, чутки без джерела, дублі однієї новини, офтоп.

categories:
  - {name: "Тренди індустрії", emoji: "📈"}
  - {name: "Угоди та інвестиції", emoji: "🤝"}
  - {name: "Релізи та технології", emoji: "🛠"}
