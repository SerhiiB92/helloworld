# Источники контента для дайджеста.
# Редактируйте этот файл, чтобы добавлять/убирать источники — код менять не нужно.
# Недоступные или сломанные фиды бот молча пропускает, так что можно
# смело экспериментировать.

# ---------------------------------------------------------------------------
# RSS-фиды: зарубежные медиа/блоги по EdTech и перформанс-маркетингу.
# Стартовый набор — подправляйте под себя.
# ---------------------------------------------------------------------------
rss:
  # -- EdTech / индустрия онлайн-образования --
  - name: TechCrunch · EdTech
    url: https://techcrunch.com/tag/edtech/feed/
  - name: Class Central Report
    url: https://www.classcentral.com/report/feed/

  # -- Перформанс, закуп, креативы, воронки --
  - name: Social Media Examiner
    url: https://www.socialmediaexaminer.com/feed/
  - name: AdEspresso Blog
    url: https://adespresso.com/feed/
  # Примечание: сюда добавляйте свои RSS. Ранее были EdSurge / Search Engine
  # Land / Demand Curve / VC.ru — их фиды отдавали 404/403, поэтому убраны.
  # Если найдёте рабочие адреса — верните.

