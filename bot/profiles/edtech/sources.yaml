# YouTube-каналы про продвижение онлайн-курсов. Читаются через RSS.
# Нужен channel_id (строка вида UCxxxxxxxx), НЕ @handle.
#
# Как узнать channel_id канала:
#   1. Откройте любое видео канала → «Поделиться» → или откройте страницу канала;
#   2. Проще всего: youtube.com/@handle → правой кнопкой «Просмотр кода» →
#      найдите "channelId":"UC...". Либо вставьте URL канала на сайт вроде
#      commentpicker.com/youtube-channel-id.php
#
# Пример:
# youtube:
#   - name: Alex Hormozi
#     channel_id: UCUyDOdBWhC1MCxEjC46d-zw
# ---------------------------------------------------------------------------
youtube: []
