name: EdTech Marketing Digest

# Ежедневный дайджест в 10:00 по Варшаве.
#
# Варшава переходит на летнее/зимнее время, а cron в GitHub работает по UTC
# без перевода часов. Плюс плановые крон-запуски GitHub бывают ощутимо
# задержаны (30-60+ мин) или изредка пропускаются. Поэтому:
#   1) запускаем воркфлоу НЕСКОЛЬКО раз утром — 08:00, 09:00 и 10:00 UTC
#      (это 10-12 Варшава летом и 09-11 зимой) — как страховка от задержек;
#   2) код (TARGET_HOUR=10) отправляет дайджест ОДИН раз в день, при первом
#      запуске в или после 10:00 по Варшаве (см. state.last_sent_date).
# Остальные запуски дня тихо выходят. Так 10:00 держится и не дублируется,
# даже если GitHub задержал или пропустил один из крон-запусков.
#
# ВАЖНО: расписание (schedule) в GitHub Actions работает только из ветки по
# умолчанию (обычно main). Пока код в отдельной ветке — тестируйте кнопкой
# "Run workflow" (workflow_dispatch). После мёржа в main заработает расписание.

on:
  schedule:
    - cron: "0 8-10 * * *"   # 08:00, 09:00, 10:00 UTC — первый запуск ≥10:00 Варшава и шлёт
  workflow_dispatch:      # ручной запуск из вкладки Actions
    inputs:
      dry_run:
        description: "Тестовый прогон без отправки в Telegram (печать в лог)"
        type: boolean
        default: false

concurrency:
  group: edtech-digest
  cancel-in-progress: false

permissions:
  contents: write         # нужно, чтобы коммитить обновлённый state.json

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Run digest
        working-directory: bot
        env:
          BOT_PROFILE: edtech
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          DIGEST_MAX_ITEMS: ${{ vars.DIGEST_MAX_ITEMS || '7' }}
          LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '48' }}
          EVERGREEN_COUNT: ${{ vars.EVERGREEN_COUNT || '2' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Warsaw' }}
          # Час-цель только для запуска по расписанию. При ручном запуске проверка
          # часа не нужна — отправляем сразу.
          TARGET_HOUR: ${{ github.event_name == 'schedule' && (vars.TARGET_HOUR || '10') || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python main.py

      - name: Commit updated state
        if: ${{ !inputs.dry_run }}
        run: |
          STATE=bot/profiles/edtech/state.json
          if [[ -n "$(git status --porcelain $STATE)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$STATE"
            git commit -m "chore: update edtech digest state [skip ci]"
            # Два бота могут коммитить одновременно — тянем с rebase и повторяем push.
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin ${{ github.ref_name }} && \
              git push origin HEAD:${{ github.ref_name }} && break || sleep 5
            done
          else
            echo "state.json без изменений — коммит не нужен"
          fi
